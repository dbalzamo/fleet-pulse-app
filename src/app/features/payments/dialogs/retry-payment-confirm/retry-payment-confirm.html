<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
    <p class="retry-payment-confirm__message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annulla</button>
    <button matButton="tonal" type="button" (click)="confirm()">Riprova addebito</button>
</mat-dialog-actions>
