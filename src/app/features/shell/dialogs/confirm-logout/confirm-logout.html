<h2 mat-dialog-title>Vuoi disconnetterti?</h2>
<mat-dialog-content>
    <p>Durante la disconnessione verranno rimossi i dati di accesso salvati. Potrai accedere di nuovo in qualsiasi momento.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button matButton="text" (click)="cancel()">Annulla</button>
    <button matButton="tonal" (click)="confirm()">Esci</button>
</mat-dialog-actions>
