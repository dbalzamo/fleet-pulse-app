# SPA configuration for the Fleet Pulse dashboard.
# Served with the nginx-unprivileged image: port 8080, non-root user (uid 101).

server_tokens off;

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (inherited by every location below) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # connect-src ora punta a 'self': le chiamate API passano dal proxy nginx
    # (stessa origine), non piu' direttamente a localhost:8081.
    # img-src include the OSM tile servers (a/b/c.tile.openstreetmap.org), used
    # by the live fleet map. connect-src vede anche ws:// (same-origin upgrade)
    # come riserva per l'eventuale feed realtime via WebSocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Angular client-side routing: always fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed / immutable static assets -> long client cache.
    location ~* \.(?:css|mjs|js)$ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Reverse proxy verso il backend (rete Docker interna, nome servizio "backend"
    # dal docker-compose.yml). Stessa origine dal punto di vista del browser:
    # niente preflight CORS, perche' la richiesta non e' piu' cross-origin.
    location /iam/ {
        proxy_pass http://backend:8081/iam/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/vehicles {
        proxy_pass http://backend:8081/api/vehicles;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never serve dotfiles (e.g. .env, .git).
    location ~ /\. {
        deny all;
    }
}
